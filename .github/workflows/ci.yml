name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Launcher on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call make.bat --demo --no-open < nul
      - name: Launcher on macOS and Linux
        if: runner.os != 'Windows'
        run: make ARGS="--demo --no-open"
