[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acc-race-stats"
version = "0.1.2"
description = "Race, qualifying and practice charts from Assetto Corsa Competizione server results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Flavio Clesio" }]
keywords = ["assetto-corsa-competizione", "acc", "sim-racing", "charts", "league"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Natural Language :: English",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = ["matplotlib>=3.10", "tomli>=2; python_version < '3.11'"]

[project.scripts]
acc-race-stats = "acc_race_stats.cli:main"

[project.urls]
Repository = "https://github.com/fclesio/acc-race-stats"
Changelog = "https://github.com/fclesio/acc-race-stats/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
exclude = ["/docs/images", "/.github"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
packages = ["acc_race_stats"]
mypy_path = "src"
[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
