[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acc-race-stats"
version = "0.1.0"
description = "Race, qualifying and practice charts from Assetto Corsa Competizione server results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Flavio Clesio" }]
dependencies = ["matplotlib>=3.9"]

[project.scripts]
acc-race-stats = "acc_race_stats.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
packages = ["acc_race_stats"]
mypy_path = "src"
[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
